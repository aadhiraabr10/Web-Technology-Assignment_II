<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration</h1>
        <p class="subtitle">Enter your details to register</p>

        <form id="registrationForm">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="roll">Roll Number</label>
            <input type="text" id="roll" placeholder="Enter roll number" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <label for="course">Select Course</label>
            <select id="course" required>
                <option value="">Choose your course</option>
                <option value="CSE">Computer Science Engineering</option>
                <option value="IT">Information Technology</option>
                <option value="ECE">Electronics and Communication</option>
                <option value="EEE">Electrical Engineering</option>
            </select>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Create a strong password" required>

            <label for="document">Upload Photo or Document</label>
            <input type="file" id="document"
                   accept=".jpg,.jpeg,.png,.pdf" required>

            <p id="errorMessage" role="alert"></p>

            <button type="submit">Register Now</button>
            <button type="reset" class="reset">Clear Form</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
